version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"  # Map host 8001 to container 8000
    environment:
      - FERNET_KEY=REDACTED_FERNET_KEY=
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./backend/soc_scans.db:/app/backend/soc_scans.db
    networks:
      - invisiscan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5173"  # Map host 5174 to container 5173
    environment:
      - VITE_API_URL=http://backend:8000  # Use service name for internal communication
    depends_on:
      - backend
    networks:
      - invisiscan-network

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    ports:
      - "5002:5000"  # Map host 5002 to container 5000
    environment:
      - FLASK_ENV=production
    networks:
      - invisiscan-network

networks:
  invisiscan-network:
    driver: bridge
